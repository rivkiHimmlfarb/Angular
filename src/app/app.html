<h1>כניסה להתקנת תוכנות לימודיות על המחשב</h1>

    <input type="text" name="id" id="id" placeholder="הכנס מספר תעודת זהות" />
<input type="checkbox" name="agree" id="agree" [(ngModel)]="agreed" />
<label for="agree">   האם קראת ואישרת את התקנון</label>
<button id="submit" [disabled]="!agreed">כניסה</button>
